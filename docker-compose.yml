services:
  liftitup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liftitup
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/liftitup.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://lift.0xpuddu.com}
    volumes:
      - liftitup-data:/app/data

volumes:
  liftitup-data:
